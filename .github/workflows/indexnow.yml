name: Notify search engines

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Give Vercel time to finish deploying before search engines are told to recrawl.
      - run: sleep 180
      - run: node scripts/indexnow.mjs https://olivet-apparel.vercel.app
